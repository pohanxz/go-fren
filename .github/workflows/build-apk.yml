name: Build Go Fren APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: go_fren_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: go_fren_app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Create Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cat > lib/supabase_config.dart <<EOF
          class SupabaseConfig {
            static const url = '$SUPABASE_URL';
            static const publishableKey = '$SUPABASE_PUBLISHABLE_KEY';
          }
          EOF

      - name: Verify Supabase config
        run: |
          test -s lib/supabase_config.dart
          grep -q "class SupabaseConfig" lib/supabase_config.dart
          grep -q "static const url" lib/supabase_config.dart
          grep -q "static const publishableKey" lib/supabase_config.dart
          echo "Supabase config created successfully."

      - name: Create Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cat > lib/supabase_config.dart <<EOF
          class SupabaseConfig {
            static const url = '$SUPABASE_URL';
            static const publishableKey = '$SUPABASE_PUBLISHABLE_KEY';
          }
          EOF

      - name: Verify Supabase config
        run: |
          test -s lib/supabase_config.dart
          grep -q "class SupabaseConfig" lib/supabase_config.dart
          grep -q "static const url" lib/supabase_config.dart
          grep -q "static const publishableKey" lib/supabase_config.dart
          echo "Supabase config created successfully."

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: List APK
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: go-fren-debug-apk
          path: go_fren_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
